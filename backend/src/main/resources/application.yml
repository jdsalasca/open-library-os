server:
  port: 8080
  servlet:
    context-path: /api
  error:
    include-message: always

spring:
  application:
    name: open-library-os
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/openlibrary}
    username: ${DB_USER:openlibrary}
    password: ${DB_PASSWORD:openlibrary}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}
      connection-timeout: 10000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  jackson:
    default-property-inclusion: non_null

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    db:
      enabled: true