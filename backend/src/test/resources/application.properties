# Test-only overrides.
#
# spring-session-jdbc is on the classpath (the auth round added it) but its tables
# are created by the auth migration, which is not in develop yet. Session storage
# is irrelevant to these tests, so the JDBC session store is switched off instead
# of the context failing on a missing "spring_session" table. Drop this file once
# V2__auth.sql lands and creates those tables.
spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.session.jdbc.autoconfigure.JdbcSessionAutoConfiguration
