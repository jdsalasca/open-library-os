<!doctype html>
<html lang="es" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Gestion de librerias autoalojada: catalogo, inventario, prestamos y mapa 3D." />
    <meta name="color-scheme" content="light dark" />
    <title>Open Library OS</title>
    <!--
      Sets the theme before the first paint so there is no white flash. It is an
      external file, not an inline script: the CSP forbids inline scripts and
      'unsafe-inline' would make the policy decorative.
    -->
    <script src="/theme.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
