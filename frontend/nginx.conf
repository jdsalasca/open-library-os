upstream backend {
    server backend:8080;
    keepalive 16;
}

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # An import document is the biggest thing a user can send, and a self-hosted
    # library on a small disk should not accept unbounded uploads either way.
    client_max_body_size 64m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               application/xml image/svg+xml application/manifest+json;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Permissions-Policy "camera=(self), geolocation=(), microphone=()" always;

    # The app ships no inline scripts and talks only to itself, so the policy can be
    # strict. 'wasm-unsafe-eval' stays because the ISBN providers are plain JSON and
    # nothing here needs WebAssembly; it is left off on purpose.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Session cookie is scoped to the app root, so /api can share it.
    location /api/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # Barcode label / 3D asset streaming must not be cut off mid-response.
        proxy_buffering off;
        proxy_read_timeout 120s;
    }

    # Vite emits content-hashed filenames, so assets are safe to cache forever.
    # `expires` rather than add_header: in nginx a single add_header inside a
    # location cancels every add_header inherited from the server block, which is
    # how the security headers above went missing without anybody noticing.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # Single-page app: every other path resolves to index.html for client routing.
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}